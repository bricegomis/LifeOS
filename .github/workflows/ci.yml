name: CI

# One workflow so the main ruleset can require a single check ("CI ok").
# Jobs are skipped when their sources did not change; the gate job always
# reports, so pull requests never wait on a check that was never started.
# The native iOS build lives in ios.yml: it needs a macOS runner, which can stay
# queued and get cancelled, so it must not turn this workflow red.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# A new push to a pull request cancels its previous run; runs on main always finish,
# so every merged commit gets a result instead of a "cancelled" one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      garmin_sync: ${{ steps.filter.outputs.garmin_sync }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'src/frontend-angular/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'src/backend/**'
              - '.github/workflows/ci.yml'
            garmin_sync:
              - 'src/garmin-sync/**'
              - '.github/workflows/ci.yml'

  frontend:
    name: Angular frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend-angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend-angular/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          LIFEOS_BUILD_ID: ${{ github.sha }}
          LIFEOS_BUILD_NUMBER: ${{ github.run_number }}
          LIFEOS_RUN_ID: ${{ github.run_id }}
          LIFEOS_RUN_ATTEMPT: ${{ github.run_attempt }}
          LIFEOS_BUILD_REPOSITORY: ${{ github.repository }}
          LIFEOS_BUILD_SERVER_URL: ${{ github.server_url }}
          LIFEOS_BUILD_WORKFLOW: ${{ github.workflow }}

  backend:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        working-directory: src/backend
        run: dotnet restore
      - name: Build
        working-directory: src/backend
        run: dotnet build --no-restore --configuration Release
      - name: Test
        working-directory: src/backend
        # tests/LifeOS.Api.IntegrationTests spins up its own ephemeral PostgreSQL
        # container via Testcontainers; ubuntu-latest runners have Docker preinstalled.
        run: dotnet test --no-build --configuration Release

  garmin-sync:
    name: garmin-sync tests
    needs: changes
    if: needs.changes.outputs.garmin_sync == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/garmin-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: docker build -t lifeos-garmin-sync:ci .

  ci-ok:
    name: CI ok
    if: always()
    needs: [changes, frontend, backend, garmin-sync]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a needed job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All required jobs passed or were skipped."
