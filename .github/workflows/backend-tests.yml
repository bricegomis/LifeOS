name: Backend Tests

on:
  push:
    branches: [main]
    paths:
      - "src/backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "src/backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        working-directory: src/backend
        run: dotnet restore

      - name: Build
        working-directory: src/backend
        run: dotnet build --no-restore --configuration Release

      - name: Test
        working-directory: src/backend
        # tests/LifeOS.Api.IntegrationTests spins up its own ephemeral PostgreSQL
        # container via Testcontainers; ubuntu-latest runners have Docker preinstalled.
        run: dotnet test --no-build --configuration Release
