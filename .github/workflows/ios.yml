name: iOS native

# Unsigned Xcode build of the Capacitor app and its widget extension. Kept out of
# CI (and its "CI ok" gate) because macOS runners can stay queued and be cancelled;
# it only runs when native sources change, or by hand.

on:
  pull_request:
    paths:
      - 'src/frontend-angular/ios/**'
      - 'src/frontend-angular/capacitor.config.ts'
      - 'src/frontend-angular/scripts/**'
      - 'src/frontend-angular/package.json'
      - 'src/frontend-angular/package-lock.json'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS native
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/frontend-angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend-angular/package-lock.json
      - name: Show native toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          pod --version
      - run: npm ci
      # cap:sync includes the production Angular build before copying web assets.
      - run: npm run cap:sync
        env:
          LIFEOS_API_URL: https://api.lifeos.example
      - name: Build app and widget for generic simulator and device (unsigned)
        shell: bash
        run: |
          set -euo pipefail
          for platform in simulator device; do
            if [[ "$platform" == simulator ]]; then
              sdk=iphonesimulator
              destination='generic/platform=iOS Simulator'
              configuration=Debug
            else
              sdk=iphoneos
              destination='generic/platform=iOS'
              configuration=Release
            fi
            for scheme in App LifeosWidgetExtension; do
              xcodebuild -workspace ios/App/App.xcworkspace \
                -scheme "$scheme" -configuration "$configuration" \
                -sdk "$sdk" -destination "$destination" \
                -derivedDataPath "ios/DerivedData/$platform" \
                CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
                CODE_SIGN_IDENTITY= build
            done
          done
