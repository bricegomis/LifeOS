name: Build & Push Docker Images

# main publishes the production images (:latest), which watchtower picks up on the VPS.
on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: latest
  API_IMAGE: ghcr.io/bricegomis/lifeos-api
  WEB_IMAGE: ghcr.io/bricegomis/lifeos-web
  GARMIN_SYNC_IMAGE: ghcr.io/bricegomis/lifeos-garmin-sync

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # Permissions requises pour publier sur GHCR avec GITHUB_TOKEN
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Backend ─────────────────────────────────────────────────────────────
      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: ./src/backend
          push: true
          tags: ${{ env.API_IMAGE }}:${{ env.IMAGE_TAG }}
          build-args: |
            LIFEOS_BUILD_ID=${{ github.sha }}
            LIFEOS_BUILD_NUMBER=${{ github.run_number }}
            LIFEOS_RUN_ID=${{ github.run_id }}
            LIFEOS_RUN_ATTEMPT=${{ github.run_attempt }}
            LIFEOS_BUILD_REPOSITORY=${{ github.repository }}
            LIFEOS_BUILD_SERVER_URL=${{ github.server_url }}
            LIFEOS_BUILD_WORKFLOW=${{ github.workflow }}
          # Layer cache partagé entre les runs GitHub Actions
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # ── Angular frontend ────────────────────────────────────────────────────
      # Public runtime configuration is supplied by the deployment environment.
      - name: Build & push Angular Web
        uses: docker/build-push-action@v6
        with:
          context: ./src/frontend-angular
          push: true
          tags: ${{ env.WEB_IMAGE }}:${{ env.IMAGE_TAG }}
          build-args: |
            LIFEOS_BUILD_ID=${{ github.sha }}
            LIFEOS_BUILD_NUMBER=${{ github.run_number }}
            LIFEOS_RUN_ID=${{ github.run_id }}
            LIFEOS_RUN_ATTEMPT=${{ github.run_attempt }}
            LIFEOS_BUILD_REPOSITORY=${{ github.repository }}
            LIFEOS_BUILD_SERVER_URL=${{ github.server_url }}
            LIFEOS_BUILD_WORKFLOW=${{ github.workflow }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # ── Garmin sync service (ADR 0019) ──────────────────────────────────────
      - name: Build & push garmin-sync
        uses: docker/build-push-action@v6
        with:
          context: ./src/garmin-sync
          push: true
          tags: ${{ env.GARMIN_SYNC_IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=garmin-sync
          cache-to: type=gha,scope=garmin-sync,mode=max
