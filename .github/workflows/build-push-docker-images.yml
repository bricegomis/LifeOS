name: Build & Push Docker Images

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/bricegomis/lifeos-api
  WEB_IMAGE: ghcr.io/bricegomis/lifeos-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # Permissions requises pour publier sur GHCR avec GITHUB_TOKEN
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Backend ─────────────────────────────────────────────────────────────
      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: ./src/backend
          push: true
          tags: ${{ env.API_IMAGE }}:latest
          build-args: |
            LIFEOS_BUILD_ID=${{ github.sha }}
          # Layer cache partagé entre les runs GitHub Actions
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # ── Angular frontend ────────────────────────────────────────────────────
      # Public runtime configuration is supplied by the deployment environment.
      - name: Build & push Angular Web
        uses: docker/build-push-action@v6
        with:
          context: ./src/frontend-angular
          push: true
          tags: ${{ env.WEB_IMAGE }}:latest
          build-args: |
            LIFEOS_BUILD_ID=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
